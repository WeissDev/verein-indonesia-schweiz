{{- $addr := .Get "addr" | default "info" -}}
{{- $domain := .Get "domain" | default "vereinindonesiaschweiz.ch" -}}
{{- $label := .Get "label" | default "" -}}
{{- $full := printf "%s@%s" $addr $domain -}}
<span class="obfuscated-email">
  <script>
    (function() {
      var a = atob("{{ base64Encode $full }}");
      var l = {{ if $label }}atob("{{ base64Encode $label }}"){{ else }}a{{ end }};
      document.write('<a href="mailto:' + a + '">' + l + '<\/a>');
    })();
  </script>
  <noscript><span>[Email: aktiviere JavaScript / enable JavaScript]</span></noscript>
</span>
